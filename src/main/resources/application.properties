# HTTPS\u9ED8\u8BA4\u7AEF\u53E3
server.port=443
# \u5F00\u542FSSL/HTTPS
server.ssl.enabled=true
# PKCS12\u683C\u5F0F\u8BC1\u4E66\u6587\u4EF6\u4F4D\u7F6E (classpath\u6307\u5411resources\u76EE\u5F55)
server.ssl.key-store=classpath:server.p12
# \u8BC1\u4E66\u6587\u4EF6\u7C7B\u578B \u56FA\u5B9A\u4E3APKCS12
server.ssl.key-store-type=PKCS12
# \u8BC1\u4E66\u7684\u5BC6\u7801\uFF08\u81EA\u5B9A\u4E49\u7684\uFF0C\u548C\u8F6C\u6362p12\u65F6\u7684\u5BC6\u7801\u4E00\u81F4\uFF09
server.ssl.key-store-password=123456
# \u8BC1\u4E66\u522B\u540D \u56FA\u5B9A\u4E3Atomcat
server.ssl.key-alias=tomcat
# \u7981\u7528\u5F31\u534F\u8BAE\uFF0C\u6EE1\u8DB3\u7B49\u4FDD\u6D4B\u8BC4\u8981\u6C42\uFF0C\u4E0D\u8981\u6539
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# \u914D\u7F6EHTTP\u8DF3\u8F6CHTTPS (\u53EF\u9009)
server.http.port=8080

#linux\u6587\u4EF6\u76EE\u5F55
#ftp.downloadDict=/home/hcdq/files/
# windows\u6587\u4EF6\u76EE\u5F55
ftp.downloadDict=D:/jk_project/file/dat/

# \u81EA\u5B9A\u4E49\u9759\u6001\u8D44\u6E90\u76EE\u5F55\uFF0C\u6DFB\u52A0 classpath:/assets/
# \u4FDD\u7559\u539F\u6709\u7684 static \u76EE\u5F55\uFF0C\u7528\u9017\u53F7\u5206\u9694\u591A\u4E2A\u76EE\u5F55
spring.web.resources.static-locations=classpath:/static/,classpath:/assets/