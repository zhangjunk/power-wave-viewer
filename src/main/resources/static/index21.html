<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>左右布局页面</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 220px;
            background-color: #f5f5f5;
            border-right: 1px solid #ddd;
            padding: 20px 10px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Microsoft YaHei', '微软雅黑', Arial, sans-serif;
        }
        .sidebar h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar ul li {
            margin-bottom: 8px;
        }
        .sidebar ul li a {
            color: #333;
            text-decoration: none;
            padding: 5px 8px;
            display: block;
            border-radius: 3px;
        }
        .sidebar ul li a:hover {
            background-color: #e0e0e0;
        }
        .content {
            flex: 1;
            padding: 30px;
            background-color: #fff;
            box-sizing: border-box;
        }
        .content h1 {
            font-size: 24px;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>目录</h2>
            <ul>
                <li><a href="#">章节一</a></li>
                <li><a href="#">章节二</a></li>
                <li><a href="#">章节三</a></li>
                <li><a href="#">章节四</a></li>
                <li><a href="#">章节五</a></li>
            </ul>
        </div>
        <div class="content">
            <h1>内容区域</h1>
            <p>这是内容展示区。点击左侧目录项可以显示不同内容。</p>
        </div>
    </div>
</body>
</html>
